version: '3.8'

services:
  app:
    build: .
    container_name: bravehearts-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=bravehearts
      - DB_USER=bravehearts
      - DB_PASSWORD=${DB_PASSWORD:-change_this_password}
      - SESSION_SECRET=${SESSION_SECRET:-change_this_secret}
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    networks:
      - bravehearts-network

  postgres:
    image: postgres:15-alpine
    container_name: bravehearts-postgres
    environment:
      - POSTGRES_DB=bravehearts
      - POSTGRES_USER=bravehearts
      - POSTGRES_PASSWORD=${DB_PASSWORD:-change_this_password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - bravehearts-network

  redis:
    image: redis:7-alpine
    container_name: bravehearts-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - bravehearts-network

  nginx:
    image: nginx:alpine
    container_name: bravehearts-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./dist:/usr/share/nginx/html:ro
      - ./uploads:/usr/share/nginx/uploads:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - bravehearts-network

volumes:
  postgres-data:
  redis-data:

networks:
  bravehearts-network:
    driver: bridge
